<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bolten</title>
  <meta name="robots" content="noindex,follow">
  <link rel="alternate" hreflang="pt-BR" href="/pt/">
  <link rel="alternate" hreflang="es" href="/es/">
  <link rel="alternate" hreflang="en" href="/en/">
  <link rel="alternate" hreflang="x-default" href="/pt/">
  <script>
    (function () {
      try {
        var supported = ['pt', 'es', 'en'];
        var lang = localStorage.getItem('bolten_lang');
        if (supported.indexOf(lang) < 0) {
          var navs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'pt'];
          lang = null;
          for (var i = 0; i < navs.length; i++) {
            var c = (navs[i] || '').slice(0, 2).toLowerCase();
            if (supported.indexOf(c) >= 0) { lang = c; break; }
          }
        }
        if (supported.indexOf(lang) < 0) lang = 'pt';
        location.replace('/' + lang + '/');
      } catch (e) {
        location.replace('/pt/');
      }
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/pt/">
  <style>body{font-family:'Arimo',system-ui,sans-serif;background:#f9fafb;color:#111}</style>
</head>
<body>
  <p style="text-align:center;margin-top:4rem">
    Redirecionando… ·
    <a href="/pt/">Português</a> ·
    <a href="/es/">Español</a> ·
    <a href="/en/">English</a>
  </p>
</body>
</html>
